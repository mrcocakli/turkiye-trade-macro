name: Monthly macro refresh

# Pulls every series in config/series.json, rebuilds the monthly values, the
# "what changed" narrative and the page, and commits the result.
#
# One-time setup:
#   1. Settings > Secrets and variables > Actions > New repository secret
#      EVDS_API_KEY = your TCMB EVDS key
#   2. Settings > Pages > Deploy from a branch > main / docs

on:
  schedule:
    - cron: "41 6 5 * *"      # 5th of each month, 09:41 Istanbul time
  workflow_dispatch:
  push:                       # a change to the series list or pipeline code rebuilds everything
    branches: [main]
    paths: ["config/**", "etl/**", "web/**", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: monthly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run the pipeline
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: python run_pipeline.py
      - name: List candidate CPI series (diagnostic, never fails the run)
        if: always()
        continue-on-error: true
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: python etl/discover.py "TÜKETİCİ" "CONSUMER" "TÜFE"
      - name: Run checks
        run: python tests/test_pipeline.py
      - name: Commit refreshed data, narrative and page
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/macro.db docs reports
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Monthly refresh $(date -u +%Y-%m-%d)"
            git push
          fi
